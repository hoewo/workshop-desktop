name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and main process
        run: pnpm run build

      - name: Package macOS arm64 zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac zip --arm64 --publish never

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-todo-macos-arm64
          path: |
            release/*.zip
            release/*.zip.blockmap
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.zip \
            release/*.zip.blockmap \
            --title "$GITHUB_REF_NAME" \
            --notes "macOS arm64 build for Workshop Todo."
