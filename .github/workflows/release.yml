name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-context:
    name: Validate release context
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "No tag ref detected; skipping package version validation."
            exit 0
          fi

          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version '$tag_version' does not match package.json version '$package_version'."
            exit 1
          fi

  macos-arm64:
    name: Build macOS arm64
    needs:
      - release-context
    runs-on: macos-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Build renderer and main process
        run: pnpm run build

      - name: Prepare macOS signing secrets
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        shell: bash
        run: |
          missing=()
          for name in APPLE_API_ISSUER APPLE_API_KEY_BASE64 APPLE_API_KEY_ID CSC_KEY_PASSWORD CSC_LINK; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          apple_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          APPLE_API_KEY_PATH="$apple_key_path" node <<'NODE'
          const fs = require("node:fs");
          const key = process.env.APPLE_API_KEY_BASE64 || "";
          fs.writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(key, "base64"));
          NODE
          echo "APPLE_API_KEY=$apple_key_path" >> "$GITHUB_ENV"

      - name: Package signed macOS arm64 builds
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --mac dmg zip --arm64 --publish never; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-todo-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  windows-x64:
    name: Build Windows x64
    needs:
      - release-context
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Build renderer and main process
        run: pnpm run build

      - name: Package Windows x64 installers
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win nsis portable --x64 --publish never
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-todo-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - macos-arm64
      - windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release-artifacts -type f | sort)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes "macOS arm64 and Windows x64 builds for Workshop Todo."
          fi
