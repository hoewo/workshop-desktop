name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Create vX.Y.Z tag from package.json and publish GitHub Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-context:
    name: Validate release context
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      manual_release: ${{ steps.release.outputs.manual_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release target
        id: release
        shell: bash
        env:
          CONFIRM_RELEASE: ${{ github.event.inputs.confirm_release }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version '$package_version' is not a plain X.Y.Z version." >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            if [[ "${CONFIRM_RELEASE:-false}" != "true" ]]; then
              echo "Manual release requires confirm_release=true because it creates a tag and publishes a GitHub Release." >&2
              exit 1
            fi

            release_tag="v${package_version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
              echo "Release tag '${release_tag}' already exists. Bump package.json version or use the existing tag release." >&2
              exit 1
            fi
            {
              echo "release_tag=${release_tag}"
              echo "release_version=${package_version}"
              echo "manual_release=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version '$tag_version' does not match package.json version '$package_version'."
            exit 1
          fi

          {
            echo "release_tag=${GITHUB_REF_NAME}"
            echo "release_version=${package_version}"
            echo "manual_release=false"
          } >> "$GITHUB_OUTPUT"

  macos-universal:
    name: Build macOS universal
    needs:
      - release-context
    runs-on: macos-15-intel
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Build renderer and main process
        run: pnpm run build

      - name: Prepare macOS signing secrets
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        shell: bash
        run: |
          missing=()
          for name in APPLE_API_ISSUER APPLE_API_KEY_BASE64 APPLE_API_KEY_ID CSC_KEY_PASSWORD CSC_LINK; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          apple_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          APPLE_API_KEY_PATH="$apple_key_path" node <<'NODE'
          const fs = require("node:fs");
          const key = process.env.APPLE_API_KEY_BASE64 || "";
          fs.writeFileSync(process.env.APPLE_API_KEY_PATH, Buffer.from(key, "base64"));
          NODE
          echo "APPLE_API_KEY=$apple_key_path" >> "$GITHUB_ENV"

      - name: Package signed macOS universal build
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx electron-builder --mac zip --universal --publish never; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

      - name: Validate macOS artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected=(
            "release/Workshop.Todo-${version}-universal-mac.zip"
            "release/Workshop.Todo-${version}-universal-mac.zip.blockmap"
            "release/latest-mac.yml"
          )
          for file in "${expected[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing expected macOS artifact: $file" >&2
              exit 1
            fi
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-todo-macos-universal
          path: |
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  windows-x64:
    name: Build Windows x64
    needs:
      - release-context
    runs-on: windows-latest
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Build renderer and main process
        run: pnpm run build

      - name: Package Windows x64 installers
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx electron-builder --win nsis portable --x64 --publish never
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds ($attempt * 30)
          }

      - name: Validate Windows artifacts
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "Workshop-Todo-Setup-$version.exe"
          $required = @(
            "release/$installer",
            "release/$installer.blockmap",
            "release/Workshop-Todo-Portable-$version.exe",
            "release/latest.yml"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing expected Windows artifact: $file"
              exit 1
            }
          }

          $metadata = Get-Content "release/latest.yml" -Raw
          if (-not $metadata.Contains("url: $installer") -or -not $metadata.Contains("path: $installer")) {
            Write-Error "latest.yml does not reference the published installer name: $installer"
            exit 1
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: workshop-todo-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - release-context
      - macos-universal
      - windows-x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        if: needs.release-context.outputs.manual_release == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release tag
        if: needs.release-context.outputs.manual_release == 'true'
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release tag '${RELEASE_TAG}' already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          mapfile -t assets < <(find release-artifacts -type f | sort)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" \
              --notes "macOS universal and Windows x64 builds for Workshop Todo."
          fi
